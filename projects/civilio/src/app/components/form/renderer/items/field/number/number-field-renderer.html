<div hlmField>
	<label hlmFieldLabel [for]="field.api.name">{{ config().title }}</label>
	<ng-container>
		<input
			type="number"
			[id]="field.api.name"
			[name]="field.api.name"
			[value]="field.api.state.value"
			(blur)="field.api.handleBlur()"
			(input)="field.api.handleChange($event.target.valueAsNumber)"
			[step]="config().type == 'integer' ? 1 : .1"
			[max]="config().max"
			[min]="config().min"
			hlmInput
		/>
	</ng-container>
	@if(hintText(); as hint) {
	<p hlmFieldDescription>{{ hint }}</p>
	}
	<ng-container>
		@if(field.api.state.meta.isTouched && !field.api.state.meta.isValid) {
		<div>
			@for(error of field.api.state.meta.errors; track $index) {
			<hlm-field-error>{{ error }}</hlm-field-error>
			}
		</div>
		}
	</ng-container>
</div>
